# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: KingDream's Blog
subtitle: '分享技术，记录成长'
description: '一个专注于技术分享的个人博客，涵盖前端、后端、算法等领域'
keywords: 技术博客,前端,后端,JavaScript,Python,算法
author: KingDream
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://kingdream-cn.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Code Highlighting
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 6
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 6
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Search
search:
  path: search.json
  field: post
  content: true

# Feed (RSS)
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Sitemap
sitemap:
  path: sitemap.xml
  tag: true
  category: true

# Deployment
deploy:
  type: git
  repository: https://github.com/kingdream-cn/kingdream-cn.github.io.git
  branch: gh-pages
